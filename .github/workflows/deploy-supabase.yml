name: Deploy Supabase
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run Tests
        run: deno test --no-check --allow-read --allow-env --no-lock supabase/functions/_shared/*.test.ts
      - name: Link Supabase Project
        run: |
          supabase link --project-ref lipjakzhzosrhttsltwo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push Migrations
        run: supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Key Functions
        run: |
          for fn in companion ai-diagnose ai-match ai-coach ai-dispute ai-quality ai-fraud-check ai-predict ai-care-agent ai-healthcheck ai-matching ai-estimate-price ai-kyc ai-auto-executor workflow-engine notify admin-dashboard payment-create payment-process wallet-manager vnpay-ipn; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref lipjakzhzosrhttsltwo --use-api || echo "⚠️ $fn deploy failed, skipping..."
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
