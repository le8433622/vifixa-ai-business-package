name: Product Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging, productization-clean-infra-core]

jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify product package layout
        run: bash scripts/package-check.sh

  web-build:
    runs-on: ubuntu-latest
    needs: package-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build

  edge-check:
    runs-on: ubuntu-latest
    needs: package-check
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check income commerce edge function
        run: deno check --no-lock supabase/functions/income-commerce/index.ts
      - name: Check shared income commerce core
        run: deno check --no-lock supabase/functions/_shared/income-commerce-core.ts
