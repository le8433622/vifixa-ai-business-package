name: AI Functions CI
on:
  push:
    branches: [main, staging]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'web/src/app/admin/ai/**'
      - 'web/src/components/admin/**'
      - 'mobile/src/app/(admin)/ai/**'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'web/src/app/admin/ai/**'
      - 'web/src/components/admin/**'
      - 'mobile/src/app/(admin)/ai/**'
      - 'tests/**'
      - 'scripts/**'

env:
  SUPABASE_URL: https://lipjakzhzosrhttsltwo.supabase.co
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript check shared modules
        run: |
          for fn in supabase/functions/_shared/ai-core.ts supabase/functions/_shared/ai-audit.ts supabase/functions/_shared/ai-rag.ts supabase/functions/_shared/auth-helper.ts; do
            echo "Checking $fn..." && deno check "$fn" 2>&1 || true
          done
      - name: TypeScript check all functions
        run: |
          for fn in supabase/functions/ai-*/index.ts supabase/functions/osm-*/index.ts supabase/functions/smart-suggestions/index.ts supabase/functions/behavioral-analytics/index.ts; do
            [ -f "$fn" ] && echo "Checking $fn..." && deno check "$fn" 2>&1 || true
          done

  golden-tests:
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run ai-chat golden tests
        run: cd supabase/functions/ai-chat && deno test --allow-read test.ts 2>&1 || true
      - name: Run API contract tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno test --allow-net --allow-env tests/api/contracts.test.ts 2>&1 || true

  web-lint:
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web && npm ci
      - run: cd web && npx eslint "src/app/admin/ai/" --no-cache 2>&1 || true

  e2e:
    needs: web-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web && npm ci
      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium 2>&1 || true
      - name: Run E2E tests
        run: cd web && npx playwright test tests/e2e/critical-flows.spec.ts --reporter=list 2>&1 || true