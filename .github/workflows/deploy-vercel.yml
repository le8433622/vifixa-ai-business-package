name: Deploy Vercel
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Tests
        run: deno test --no-check --allow-read --allow-env --no-lock supabase/functions/_shared/*.test.ts
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy to Vercel
        run: cd web && npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
